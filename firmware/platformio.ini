[env:tdisplay_s3]
platform = espressif32 @ ^6.9.0
board = lilygo-t-display-s3
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.partitions = default_16MB.csv
build_flags =
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DUSER_SETUP_LOADED=1
  -DST7789_DRIVER=1
  -DTFT_WIDTH=170
  -DTFT_HEIGHT=320
  -DTFT_MOSI=35
  -DTFT_SCLK=36
  -DTFT_CS=34
  -DTFT_DC=37
  -DTFT_RST=38
  -DTFT_BL=33
  -DLOAD_GLCD=1
  -DLOAD_FONT2=1
  -DSMOOTH_FONT=1
lib_deps =
  h2zero/NimBLE-Arduino @ ^1.4.0
  bblanchon/ArduinoJson @ ^7.0.0
  bodmer/TFT_eSPI @ ^2.5.0

[env:native]
platform = native
test_build_src = true
build_flags = -DUNIT_TEST
