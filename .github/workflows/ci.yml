name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  web-test:
    name: Web (Vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: npm install
      - name: Unit tests
        run: npm test

  # Firmware native tests need PlatformIO on the runner.
