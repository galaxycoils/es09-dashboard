name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  web-test:
    name: Web (Vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          # No package-lock.json in repo yet — skip npm cache until lockfile is committed

      - name: Install dependencies
        run: npm install

      - name: Unit tests
        run: npm test
